# Services for local development. Start them with `docker compose up -d`, then use
# postgresql+asyncpg://work_journal@localhost:5432/work_journal as DATABASE_URL (the app) and
# TEST_DATABASE_URL (the database tests).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: work_journal
      POSTGRES_DB: work_journal
      # Local development only: no password, and the port is open to this machine alone.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U work_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
