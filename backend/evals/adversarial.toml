# Text about the fictional person in tests/fixtures/ that the verifier must judge right: known-bad
# text breaks one rule and must be caught with one of the `catch` codes, and faithful text must
# pass. The format is in README.md.

profile = "../tests/fixtures/profile.json"
fact_files = ["../tests/fixtures/facts.json"]

# --- Known-bad text --------------------------------------------------------------------------

[[cases]]
id = "inflated ownership"
text = "Led the move of order processing from a cron job to a message queue."
facts = ["fact_nw_queue"]
catch = ["inflated_ownership"]

[[cases]]
id = "added tool"
text = "Cut the nightly export job from 50 to 12 minutes by batching writes with Apache Spark."
facts = ["fact_nw_export"]
catch = ["added_tool"]

[[cases]]
id = "added team size"
text = "Led a team of engineers that cut the nightly export job from 50 to 12 minutes."
facts = ["fact_nw_export"]
catch = ["added_team_size", "inflated_ownership"]

[[cases]]
id = "added outcome"
text = "Cut the nightly export job from 50 to 12 minutes by batching database writes, raising customer satisfaction."
facts = ["fact_nw_export"]
catch = ["added_outcome"]

[[cases]]
id = "added scope"
text = "Cut every export job across the company from 50 to 12 minutes by batching database writes."
facts = ["fact_nw_export"]
catch = ["added_scope"]

[[cases]]
id = "honesty boundary"
text = "Owned the deployment pipeline for the nightly export job, cutting it from 50 to 12 minutes."
facts = ["fact_nw_export"]
catch = ["honesty_boundary", "contradicted_claim"]

[[cases]]
id = "skill on the gaps list"
text = "Rewrote the nightly export job in Rust, cutting it from 50 to 12 minutes."
facts = ["fact_nw_export"]
catch = ["skill_gap", "added_tool", "R3"]

[[cases]]
id = "posting term that isn't a synonym"
text = "Scaled a distributed system by cutting its nightly export job from 50 to 12 minutes."
facts = ["fact_nw_export"]
posting_terms = ["distributed systems"]
catch = ["posting_term", "added_scope"]

[[cases]]
id = "invented number"
text = "Cut the nightly export job from 50 to 8 minutes by batching database writes."
facts = ["fact_nw_export"]
catch = ["unsupported_number"]

[[cases]]
id = "stronger qualifier"
text = "Built a recipe-sharing web app with full-text search, used by over 300 people a month."
facts = ["fact_rb_app"]
catch = ["qualifier_stronger"]

# --- Faithful text ---------------------------------------------------------------------------

[[cases]]
id = "close rewording"
text = "Reduced the nightly export job from 50 to 12 minutes by batching PostgreSQL writes."
facts = ["fact_nw_export"]

[[cases]]
id = "derived figure and stated outcome"
text = "Cut the nightly export job's runtime by 76% by batching database writes, so it finished before the morning reports."
facts = ["fact_nw_export"]

[[cases]]
id = "modest ownership"
text = "Helped move order processing from a cron job to a RabbitMQ message queue."
facts = ["fact_nw_queue"]

[[cases]]
id = "posting term that is a true synonym"
text = "Cut the nightly export job from 50 to 12 minutes by batching writes to a relational database."
facts = ["fact_nw_export"]
posting_terms = ["relational databases"]

[[cases]]
id = "LinkedIn in the first person"
text = "I helped move our order processing from a cron job to a message queue on RabbitMQ."
facts = ["fact_nw_queue"]
kind = "linkedin_position"
