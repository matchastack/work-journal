[[cases]]
id = "an agent's work is the owner's"
project = "recipe_box"
never = ['\bled\b']

[[cases.items]]
label = "c1"
kind = "commit"
month = "2024-04"
maker = "agent"
agent = "Claude Code"
title = "Serve recipe suggestions from a FastAPI endpoint"
body = "Suggests three recipes from what's in the pantry."

[[cases.expected]]
